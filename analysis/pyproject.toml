[project]
name = "3d-recon"
version = "0.1.0"
description = "3D reconstruction from brain activity"
readme = "README.md"
requires-python = ">=3.11.10"
dependencies = [
    "arviz>=0.22.0",
    "bambi>=0.15.0",
    "bdpy>=0.25.1",
    "datasets>=4.0.0",
    "hydra-core>=1.3.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.2",
    "nltk>=3.9.1",
    "numpy>=2.1.1",
    "openexr>=3.3.5",
    "pandas>=2.2.2",
    "pillow>=10.4.0",
    "pip>=24.2",
    "pyyaml>=6.0.2",
    "pyvista>=0.44.1",
    "scipy==1.13.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.0.0",
    "statsmodels>=0.14.4",
    "torch>=2.4.1",
    "trimesh>=4.4.9",
    "rpy2>=3.5.11,<3.6",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon3d"]
