[project]
name = "reconstruction-diffusion-point-cloud"
version = "0.1.0"
requires-python = ">=3.7.1,<3.11"
dependencies = [
    "diffusion-point-cloud",
    "numpy>=1.20",
    "torch>=1.6",
    "torchvision>=0.7",
    "h5py>=3.3",
    "tqdm>=4.61",
    "hydra-core>=1.3",
    "pandas>=1.3",
    "hdf5storage>=0.1.19",
    "bdpy>=0.25.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.sources]
diffusion-point-cloud = { path = "../../lib/diffusion-point-cloud", editable = true }
